# Render blueprint for the SCcompanion Discord bot.
#
# Deploy: push this repo to GitHub, then in Render choose
#   New + → Blueprint → pick the repo.
# Render reads this file and creates the service, the disk and the env vars.
#
# Two things to know before you start:
#   1. The DISCORD_TOKEN is marked `sync: false`, so Render prompts you for it
#      in the dashboard rather than expecting it in this file. Never commit a
#      token.
#   2. The disk below is what keeps hangar data. Without it, every redeploy
#      wipes the database.

services:
  - type: worker
    name: sccompanion
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    # A Discord gateway bot holds one long-lived connection. More than one
    # replica would run duplicate bots answering the same interactions.
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      # Where the database file lives. Must match the disk mountPath below.
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    disk:
      name: sccompanion-data
      mountPath: /data
      sizeGB: 1
